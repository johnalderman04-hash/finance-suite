name: daily-rebuild

# Weekday-morning rebuild of the Finance Suite's bundled market data.
#
# What this does: collect free market data (Nasdaq screener/analyst, Yahoo
# price history, CBOE delayed options) -> VALIDATE it -> rebuild the static
# index.html -> run headless smoke tests -> commit + deploy to GitHub Pages.
#
# What this never does: deploy broken data. If collection or validation fails,
# the job stops before commit/deploy and the previous good Pages deployment
# stays live. No backend, no database, no paid APIs, no secrets.
#
# The deployed site remains 100% static. This workflow is only build infra.

on:
  schedule:
    - cron: '0 12 * * 1-5' # ~7:00 AM America/Chicago (CDT) on weekdays
  workflow_dispatch: {}     # manual "Run workflow" button — same pipeline

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository (with history for prev-bundle comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe data sources (runner compatibility check)
        id: probe
        run: |
          python3 - <<'EOF'
          import urllib.request
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}
          probes = {
            'nasdaq-screener': 'https://api.nasdaq.com/api/screener/stocks?tableonly=true&limit=5&offset=0&download=true',
            'yahoo-chart': 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d',
            'cboe-options': 'https://cdn-api.cboe.com/api/global/delayed_quotes/options/AAPL.json',
          }
          failed = []
          for name, url in probes.items():
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(64)
                      ok = (r.status == 200 and len(body) > 0)
                      print('  %-16s HTTP %s %s' % (name, r.status, 'OK' if ok else 'EMPTY/BAD'))
                      if not ok: failed.append(name)
              except Exception as e:
                  print('  %-16s FAILED: %s' % (name, str(e)[:140])); failed.append(name)
          if failed:
              print('NOTE: unreachable sources: %s. Collector will retry; validation gates deployment.' % ', '.join(failed))
          else:
              print('All sources reachable from this runner.')
          EOF

      - name: Collect fresh discovery data
        id: collect
        timeout-minutes: 240
        run: |
          echo "collection started: $(date -u +%FT%TZ)"
          python3 _build/collect_discovery.py 2>&1 | tee /tmp/collect.log
          echo "collection finished: $(date -u +%FT%TZ)"

      - name: Validate collected data (blocks deploy on failure)
        id: validate
        run: |
          git show HEAD:_build/data/discovery.js > /tmp/prev_discovery.js 2>/dev/null \
            && echo "comparing against previous bundle at HEAD" \
            || echo "no previous bundle at HEAD (first run)"
          python3 _build/validate_data.py _build/data/discovery.js --prev /tmp/prev_discovery.js 2>&1 | tee /tmp/validation.log
          # validate_data.py exits non-zero on FAIL -> job stops here, no deploy.

      - name: Rebuild index.html
        run: bash _build/build.sh

      - name: Headless smoke test (freshness chip, routes, no JS errors)
        run: |
          pip install --quiet websocket-client
          python3 _build/smoke_test.py "$GITHUB_WORKSPACE/index.html"

      - name: Stage deployment files (site only — no build internals)
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html manifest.json icon-512.png _site/

      - name: Commit rebuilt data (for history + prev-bundle comparison)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html _build/data/discovery.js
          git diff --cached --quiet || git commit -m "daily data rebuild $(date -u +%F)"
          git push

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Finance Suite rebuild — $(date -u +%F_%T_UTC)"
            echo ""
            echo "### Validation"
            echo '```'
            cat /tmp/validation.log 2>/dev/null || echo "validation did not run"
            echo '```'
            echo "### Collection tail"
            echo '```'
            tail -12 /tmp/collect.log 2>/dev/null || echo "no collect log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-report
          path: |
            /tmp/validation.log
            /tmp/collect.log

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
